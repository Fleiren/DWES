# ----------------------------------------------------------------------
# DOCKER-COMPOSE BASE (COMPARTIDO Y PARA GIT)
# Configuración funcional de todos los servicios.
# ----------------------------------------------------------------------
services:
  # Apache + PHP
  proyecto1php:
    build:
      context: ./.docker
      dockerfile: Dockerfile
      args:
        - USER_UID=${USER_UID}
        - USER_GID=${USER_GID}
        - USERNAME=${USERNAME}
    # Usuario y permisos compartidos
    user: ${USER_UID}:${USER_GID}

    # Volúmenes esenciales y configuraciones
    volumes:
      - ./src:/var/www/html
      - .docker/apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
      #- .docker/apache/apache2.conf:/etc/apache2/apache2.conf
      - .docker/php/php.ini-development:/usr/local/etc/php/php.ini-development
      - .docker/xdebug/debug.ini:/usr/local/etc/php/conf.d/debug.ini

    # Puerto de Apache (neutro)
    #ports:
    #  - 80:80
    expose:
      - 80

    # Dependencias de red (claves para la comunicación interna)
    networks:
      - proyecto1_shared_net
    links:
      - mariadb
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MariaDB (Base de datos compartida)
  mariadb:
    image: mariadb:latest
    volumes:
      - .docker/mariadb:/var/lib/mysql:Z
    ports:
      - 3307:3306 # Puerto interno estándar de MariaDB
    networks:
      - proyecto1_shared_net
    environment:
      # Las credenciales base deben ir a Git para que el código funcione
      MARIADB_ROOT_PASSWORD: toor
      MARIADB_DATABASE: proyecto1
      MARIADB_USER: irene
      MARIADB_PASSWORD: toor
    command:
      --default-authentication-plugin=mysql_native_password

  # Mongo
  mongo:
    image: mongo
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: irene
      MONGO_INITDB_ROOT_PASSWORD: toor
    networks:
      - proyecto1_shared_net
    ports:
      - 27018:27017 # Puerto interno estándar de Mongo

  # Redis
  redis:
    image: redis:latest
    volumes:
      - .docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379 # Puerto interno estándar de Redis
    networks:
      - proyecto1_shared_net

# (OpenLDAP se mantiene comentado, pero en la sección de servicios)

networks:
  proyecto1_shared_net:
    name: proyecto1_shared_net
    driver: bridge
